name: JioTV Playlist Update

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

env:
  SOURCE_URL: "https://alex4528.site/jplus/playlist.m3u"
  OUTPUT_FILE: "alaxl.m3u"
  FILTER_TAG: "jiotv"               # set to "" to keep all entries
  # FILTER_GROUP: "Entertainment"   # optional group-title filter

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Source Playlist
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 120 \
            "$SOURCE_URL" \
            -o raw_playlist.m3u
          test -s raw_playlist.m3u
          echo "✅ Source downloaded."

      - name: Process Playlist (Practical Validation)
        run: |
          python3 <<'PY'
          import re, sys, os
          from pathlib import Path

          source = Path("raw_playlist.m3u")
          output = Path(os.environ["OUTPUT_FILE"])
          filter_tag = os.environ.get("FILTER_TAG", "").strip().lower()
          filter_group = os.environ.get("FILTER_GROUP")

          content = source.read_text(encoding="utf-8")
          if not content.startswith("#EXTM3U"):
              print("ERROR: Not a valid M3U file (missing #EXTM3U).")
              sys.exit(1)

          raw_blocks = content.split("#EXTINF")[1:]
          total_raw = len(raw_blocks)
          print(f"Total #EXTINF entries found: {total_raw}")

          valid_blocks = []

          for raw in raw_blocks:
              block = "#EXTINF" + raw
              block = block.strip()
              if not block:
                  continue

              # ---- 1. Must contain an MPD URL ----
              if not re.search(r"https?://[^\s]+\.mpd", block, re.IGNORECASE):
                  continue

              # ---- 2. Must contain the __hdnea__ token (essential for playback) ----
              if "__hdnea__" not in block.lower():
                  continue

              # ---- 3. Optional: filter by tag ----
              if filter_tag and filter_tag not in block.lower():
                  continue

              # ---- 4. Optional: filter by group-title ----
              if filter_group:
                  m = re.search(r'group-title="([^"]+)"', block)
                  if not m or m.group(1) != filter_group:
                      continue

              valid_blocks.append(block)

          print(f"Entries after filters/validation: {len(valid_blocks)}")

          if not valid_blocks:
              print("ERROR: No entries survived. Check the filter tag or source format.")
              # Optionally, print a sample block to debug:
              if raw_blocks:
                  print("Sample first block from source:")
                  print(raw_blocks[0][:500] + "...")
              sys.exit(1)

          result = "#EXTM3U\n\n" + "\n\n".join(valid_blocks) + "\n"
          if result.count("#EXTINF") != len(valid_blocks):
              print("ERROR: Block count mismatch after assembly.")
              sys.exit(1)

          output.write_text(result, encoding="utf-8")
          print(f"✅ Playlist saved with {len(valid_blocks)} entries.")
          PY

      - name: Verify Output
        run: |
          test -s "$OUTPUT_FILE"
          grep -q "^#EXTM3U" "$OUTPUT_FILE"
          grep -q "#EXTINF" "$OUTPUT_FILE"
          echo "✅ Output playlist is valid."

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore: update JioTV playlist"
          git pull --rebase origin main
          git push origin main
