name: Sync kx

# Global environment setting to suppress and force Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and Process M3U Links
        run: |
          python -c "
          import urllib.request
          
          url = 'https://yowaimo.in/ZioGarmTara-JTV/playlist.php'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode('utf-8')
              
              with open('Asi.m3u', 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Successfully downloaded and written to Asi.m3u.')
          except Exception as e:
              print(f'Error fetching playlist: {e}')
              exit(1)
          "

      - name: Commit and Force Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Asi.m3u
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Asi.m3u from external source"
            git push origin main --force
          else
            echo "No changes detected in Asi.m3u. Skipping push."
          fi
