name: Sync kx

# Global environment setting to suppress and force Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # Fetches all history so rebase can execute smoothly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and Process M3U Links
        run: |
          python -c '
          import urllib.request
          import re

          url = "https://jio.infinitytv.indevs.in?playlist"
          try:
              # Fetch content from the playlist URL
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as response:
                  content = response.read().decode("utf-8")
              
              # Write the extracted content directly to your target file
              with open("Klx.m3u", "w", encoding="utf-8") as f:
                  f.write(content)
              print("Successfully downloaded and extracted playlist data.")
          except Exception as e:
              print(f"Error fetching playlist: {e}")
              exit(1)
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add Klx.m3u
          
          # Only proceed if changes are detected
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Klx.m3u from external source"
            
            # Fetch explicitly before pulling to align local tracking pointers
            git fetch origin main
            git pull --rebase origin main
            
            # Push changes; retry once with a fresh fetch if a race condition occurs
            git push origin main || {
              echo "Push failed, retrying with an emergency rebase..."
              git fetch origin main
              git pull --rebase origin main
              git push origin main
            }
          else
            echo "No updates to sync."
          fi
