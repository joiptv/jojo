name: Sir 

on:
  schedule:
    # Runs automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows you to trigger the activation and download manually anytime

permissions:
  contents: write

jobs:
  activate-and-fetch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository contents
      uses: actions/checkout@v4

    - name: Step 1 - Trigger Automatic Activation Handshake
      run: |
        echo "Sending activation handshake ping to the server..."
        # Using a custom User-Agent to mimic an Android IPTV player device
        curl -A "ExoPlayerLib/2.18.5 (Linux;Android 11)" -s -L "https://activation-07live.pages.dev/activate.m3u8" -o /dev/null
        
        echo "Handshake sent. Waiting 3 seconds for backend database to update token status..."
        sleep 3

    - name: Step 2 - Fetch and Rename Main Playlist
      run: |
        echo "Downloading source playlist with active session token..."
        curl -s -L "https://raw.githubusercontent.com/joiptv/jojo/refs/heads/main/Ser.m3u" -o Sir.m3u
        
        # Validation check to ensure the file isn't empty or broken
        if [ -s Sir.m3u ]; then
          echo "Playlist successfully updated and saved as Sir.m3u"
        else
          echo "Error: The source link returned an empty file!" && exit 1
        fi

    - name: Step 3 - Commit and Push Updates to Your Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Push changes only if the playlist data has refreshed/changed
        if [ -n "$(git status --porcelain)" ]; then
          git add Sir.m3u
          git commit -m "Automated Refresh: Handshake renewed & Sir.m3u updated [$(date -u +'%Y-%m-%d %H:%M:%S')] UTC"
          git push
        else
          echo "Playlist contents are identical. Token state maintained."
        fi

