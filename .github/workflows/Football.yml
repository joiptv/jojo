name: Auto-Sync football Only

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Sync Script
        run: |
          python << 'EOF'
          import requests
          import re
          import os

          FILE_NAME = "Football.m3u"
          SOURCE_URL = "https://raw.githubusercontent.com/joiptv/jojo/refs/heads/main/pocket.m3u"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          def get_all_blocks(content):
              blocks = []
              current_block = []
              for line in content.splitlines():
                  if line.startswith("#EXTINF") or line.startswith("#KODIPROP"):
                      if current_block:
                          blocks.append("\n".join(current_block))
                          current_block = []
                  current_block.append(line)
              if current_block:
                  blocks.append("\n".join(current_block))
              return blocks

          def get_channel_id(block):
              match = re.search(r'tvg-id="([^"]+)"', block)
              return match.group(1) if match else None

          try:
              print(f"Fetching from source...")
              response = requests.get(SOURCE_URL, headers=HEADERS, timeout=30)
              response.raise_for_status()

              source_blocks = get_all_blocks(response.text)
              source_dict = {
                  get_channel_id(sb): sb.strip()
                  for sb in source_blocks
                  if get_channel_id(sb)
              }

              if not os.path.exists(FILE_NAME):
                  print(f"Error: {FILE_NAME} not found!")
                  exit(1)

              with open(FILE_NAME, "r", encoding="utf-8") as f:
                  current_playlist = f.read()

              my_blocks = get_all_blocks(current_playlist)
              updated_blocks = []

              for mb in my_blocks:
                  if "jiotv" in mb.lower():
                      cid = get_channel_id(mb)
                      if cid in source_dict:
                          updated_blocks.append(source_dict[cid])
                          print(f"Updated: {cid}")
                      else:
                          updated_blocks.append(mb)
                  else:
                      updated_blocks.append(mb)

              header = current_playlist.splitlines()[0] if current_playlist.strip() else "#EXTM3U"
              new_playlist = header + "\n" + "\n".join(updated_blocks)

              with open(FILE_NAME, "w", encoding="utf-8") as f:
                  f.write(new_playlist)
              print("Update successful.")

          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update JioTV links"
            git push
          else
            echo "No changes to commit"
          fi
