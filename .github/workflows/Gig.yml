name: Update Gig Playlist

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch playlist
        run: |
          if ! curl -sfL -A "TiviMate/5.1.0" \
            "https://activation-07live.pages.dev/playlist?user=${{ secrets.PLAYLIST_USER }}&pass=${{ secrets.PLAYLIST_PASS }}&token=${{ secrets.PLAYLIST_TOKEN }}" \
            -o gig.m3u; then
            echo "Primary fetch failed, trying fallback..."
            curl -sfL -A "TiviMate/5.1.0" \
              "https://local.07live.workers.dev/all.m3u?user=${{ secrets.FALLBACK_USER }}&pass=${{ secrets.FALLBACK_PASS }}" \
              -o gig.m3u || exit 1
          fi
          if ! head -n 1 gig.m3u | grep -q "#EXTM3U"; then
            echo "Invalid M3U file"
            exit 1
          fi
          echo "Playlist fetched successfully"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gig.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Gig Playlist $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
