name: Update Gig Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # Updates every 3 hours
  workflow_dispatch:      # Manual run button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Bypass Landing Page
        run: |
          # We use the TiviMate User-Agent which usually bypasses the Telegram preview
          curl -sL -A "TiviMate/5.1.0 (Linux; Android 11)" \
          "https://activation-07live.pages.dev/playlist?user=le-beta&pass=maar-moj&token=ddbc81af564f46ceb5bc278a5a079ec8e1ddcd7d14bb47f4b5cdd502069ed8f6" -o gig.m3u

      - name: Verify Content
        run: |
          # Check the first line of the file
          FIRST_LINE=$(head -n 1 gig.m3u)
          echo "First line of file is: $FIRST_LINE"
          
          if [[ "$FIRST_LINE" == *"#EXTM3U"* ]]; then
            echo "Success: File is a valid M3U."
          else
            echo "Error: Still getting HTML/Telegram page. Trying alternative URL..."
            # Try the 'raw' variant as a backup
            curl -sL -A "TiviMate/5.1.0" "https://local.07live.workers.dev/all.m3u?user=999&pass=999" -o gig.m3u
            if ! grep -q "#EXTM3U" gig.m3u; then
              echo "Both attempts failed to fetch raw M3U data."
              exit 1
            fi
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gig.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated Gig Playlist $(date +'%Y-%m-%d %H:%M')" && git push)
