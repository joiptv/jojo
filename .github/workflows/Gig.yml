name: Update Gig Playlist

on:
  schedule:
    - cron: '0 */3 * * *' # Updates every 3 hours
  workflow_dispatch:      # Manual run button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Source Playlist
        run: |
          # Replace SOURCE_URL with your active Vercel API or GitHub raw link
          SOURCE_URL="INSERT_YOUR_WORKING_URL_HERE"
          
          # Downloading to a temporary file for processing
          curl -sL -A "TiviMate/5.1.0" "$SOURCE_URL" -o temp.m3u

      - name: Verify Content and Filter JioTV Channels
        run: |
          # Check the first line of the fetched file
          FIRST_LINE=$(head -n 1 temp.m3u)
          echo "First line of file is: $FIRST_LINE"
          
          if [[ "$FIRST_LINE" == *"#EXTM3U"* ]]; then
            echo "Success: File is a valid M3U. Filtering channels..."
            
            # Initialize the primary playlist file
            echo "#EXTM3U" > gig.m3u
            
            # Extract only channels containing the 'jiotv' tag
            grep -A 1 -i "jiotv" temp.m3u >> gig.m3u
            
            # Clean up the output by removing grep's group separator dashes
            sed -i '/^--$/d' gig.m3u
            
            echo "Filtering complete. gig.m3u is ready."
          else
            echo "Error: Did not receive raw M3U data. Output received:"
            cat temp.m3u
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add the main playlist file
          git add gig.m3u
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated gig.m3u $(date +'%Y-%m-%d %H:%M')" && git push)
