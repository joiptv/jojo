name: M3U പ്ലേലിസ്റ്റ് അപ്ഡേറ്റ്

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and Process M3U Links
        run: |
          # നിങ്ങളുടെ വർക്കർ URL-ൽ നിന്ന് gogo.m3u എന്ന പേരിലേക്ക് ഡൗൺലോഡ് ചെയ്യുന്നു
          curl -L "https://la.drmlive.net/tp/playlist" -o gogo.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # gogo.m3u ഫയൽ സ്റ്റേജ് ചെയ്യുന്നു
          git add gogo.m3u
          
          if git diff --staged --quiet; then
            echo "മാറ്റങ്ങൾ ഒന്നും തന്നെയില്ല."
          else
            git commit -m "chore: update gogo.m3u from external source"
            git pull --rebase origin main
            git push origin main
          fi
