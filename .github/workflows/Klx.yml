name: klx

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: playlist-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Process M3U Links
        run: |
          curl -L "https://jhs-channels.rtxcric.workers.dev/playlist.m3u" -o Klx.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add Klx.m3u
          
          if git diff --staged --quiet; then
            echo "No changes detected in playlist."
          else
            git commit -m "chore: update Klx.m3u from external source"
            git push origin main
          fi
