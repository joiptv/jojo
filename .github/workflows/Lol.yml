name: Update Lol Playlist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch playlist content and update Lol.m3u
        run: |
          curl -s "https://airtelxtream.yashnemade12250.workers.dev/" > Lol.m3u
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add Lol.m3u
          git commit -m "Update Lol.m3u from worker" || echo "No changes to commit"
          git push
