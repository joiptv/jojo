name: Update Lol Playlist - Asia Malayalam

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and filter playlist content
        run: |
          curl -s "https://airtelxtream.yashnemade12250.workers.dev/" > all_channels.m3u
          grep -i -A 1 'ASIA | MALAYALAM' all_channels.m3u | grep -v '^--$' > Lol.m3u || true
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add Lol.m3u
          git commit -m "Update Lol.m3u with ASIA | MALAYALAM channels" || echo "No changes to commit"
          git push
