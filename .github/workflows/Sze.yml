name: Sync jin

# Global environment setting to suppress and force Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download Original Playlist
        run: curl -L "https://alex4528.site/playlist/jtv.m3u" -o jin.m3u

      - name: Extract Links and Create New Playlist
        shell: python
        run: |
          import re
          input_file = "jin.m3u"
          output_file = "Zoh.m3u"
          
          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f"Error: {input_file} not found.")
              exit(0)
              
          new_playlist = ["#EXTM3U\n"]
          current_info = ""
          
          for line in lines:
              line = line.strip()
              if not line:
                  continue
              
              # Save the channel metadata line (#EXTINF)
              if line.startswith("#EXTINF"):
                  current_info = line
                  
              # If it's a URL, extract it and filter
              elif line.startswith("http://") or line.startswith("https://"):
                  original_link = line
                  
                  # Verify the channel has the 'jiotv' tag before adding to the final playlist
                  if current_info and "jiotv" in current_info.lower():
                      new_playlist.append(f"{current_info}\n")
                      new_playlist.append(f"{original_link}\n")
                  
                  current_info = "" # Reset for next channel
                  
              elif line.startswith("#EXTM3U"):
                  continue
              else:
                  # Catch any other tags like #EXTGRP
                  if current_info:
                      new_playlist.append(f"{line}\n")
                      
          with open(output_file, "w", encoding="utf-8") as f:
              f.writelines(new_playlist)
          print(f"Successfully generated {output_file} targeting specific channels.")

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add the newly downloaded playlist and the processed output file
          git add jin.m3u Zoh.m3u
          
          # Only proceed if changes are detected
          if ! git diff --cached --quiet; then
            git commit -m "chore: update playlists and extract new codes"
            
            # Fetch and rebase remote changes to avoid push conflicts
            git pull --rebase origin main
            
            git push origin main
          else
            echo "No updates to sync."
          fi
