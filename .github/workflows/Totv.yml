name: Pocket Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:      # allows manual run

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Pocket
        run: |
          curl -L -A "Mozilla/5.0" "https://tiny.cc/Pocket-TV" -o pocket.m3u

      - name: Check if file is empty
        run: |
          if [ -s pocket.m3u ]; then
            echo "File downloaded successfully."
          else
            echo "File is empty! Check URL or credentials."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add pocket.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
