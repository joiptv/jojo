name:Pocket Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # ഓരോ 6 മണിക്കൂറിലും റൺ ആകും
  workflow_dispatch: # മാനുവൽ ആയി റൺ ചെയ്യാനും

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Pocket
        run: |
          # 'User-Agent' നൽകുന്നത് വഴി സെർവർ ബ്ലോക്ക് ചെയ്യുന്നത് ഒഴിവാക്കാം
          curl -L -A "Mozilla/5.0" "https://tiny.cc/Pocket-TV" -o pocket.m3u

      - name: Check if file is empty
        run: |
          if [ -s pocket.m3u ]; then
            echo "File downloaded successfully."
          else
            echo "File is empty! Check URL or credentials."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update pocket: $(date)" && git push)

