name: Sync Jojo File from Link

on:
  push:
    branches:
      - main  # നിങ്ങളുടെ പ്രധാന ശാഖ

jobs:
  update_jojo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Download Updated File
        run: |
          curl -L -o Jojo.m3u https://raw.githubusercontent.com/alex4528x/m3u/refs/heads/main/jtv.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Jojo.m3u
          git commit -m "Update Jojo.m3u from external link"
          git push
