name: Sync Jojo File from External Link

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Added for manual testing
  push:
    branches:
      - main

jobs:
  update_jojo:
    runs-on: ubuntu-latest
    # Force Node.js 24 across all steps to prevent future errors
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # Updated from v3

      # Since you are using a standard shell script (curl), 
      # you don't actually need setup-node unless you are running JS code.
      # If you don't need Node.js for scripts, you can remove this step.
      - name: Set up Node.js environment
        uses: actions/setup-node@v4 # Updated from v6.3.0
        with:
          node-version: '24'

      - name: Download Updated File
        run: |
          curl -L -o Jojo.m3u https://raw.githubusercontent.com/alex4528x/m3u/refs/heads/main/jtv.m3u

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only commit if there are actual changes
          git add Jojo.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Update Jojo.m3u from external link"
            git push origin main
          else
            echo "No changes to Jojo.m3u"
          fi
